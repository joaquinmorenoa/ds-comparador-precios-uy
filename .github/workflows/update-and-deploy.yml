name: Update data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Dia 3 de cada mes, 12:00 UTC (el SIPC publica por trimestre).
    - cron: "0 12 3 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # El ETL (bajar y procesar los ~2 GB) corre SOLO en el schedule mensual o
      # a mano (workflow_dispatch), NUNCA en un push. Asi, cambiar el frontend
      # (titulo, colores, textos) se publica al instante sin re-bajar los datos:
      # el deploy usa el frontend/data.js ya commiteado por la ultima corrida.
      - name: Run ETL and build web data
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python -u src/etl.py
          python -u src/build_web_data.py

      - name: Commit refreshed data.js
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data.js
          git commit -m "chore: refresh price data [skip ci]" || echo "sin cambios"
          git push || echo "nada para pushear"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - uses: actions/deploy-pages@v4
